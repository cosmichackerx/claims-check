name: claims-check
description: "Fail CI when numbers and versions in your README (test counts, case counts, version pins) no longer match the repository."
author: cosmichackerx
branding:
  icon: check-circle
  color: blue
inputs:
  config:
    description: "Claims file, relative to `root`."
    default: ".claims.json"
  root:
    description: "Repository root the claims and commands are resolved against."
    default: "."
  summary:
    description: "Append a Markdown table to the job summary (true or false)."
    default: "true"
runs:
  using: composite
  steps:
    - name: Run claims-check
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_SUMMARY: ${{ inputs.summary }}
      run: |
        if command -v python3 > /dev/null 2>&1 && python3 -c "import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)"; then py=python3; else py=python; fi
        export PYTHONPATH="$ACTION_DIR/src"
        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          "$py" -m claims_check --root "$INPUT_ROOT" --config "$INPUT_CONFIG" --format markdown >> "$GITHUB_STEP_SUMMARY" || true
        fi
        "$py" -m claims_check --root "$INPUT_ROOT" --config "$INPUT_CONFIG" --format github || rc=$?
        "$py" -m claims_check --root "$INPUT_ROOT" --config "$INPUT_CONFIG" --format text
